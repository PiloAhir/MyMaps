name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Android App Source
        run: |
          mkdir -p www
          cp index.html www/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "MyMaps" "com.pilo.mymaps" --web-dir www
          npx cap add android

      - name: Build APK with Docker Container
        uses: docker://mingc/android-build-box:latest
        with:
          entrypoint: /bin/bash
          args: -c "cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon"

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Bharat-Offline-Map-APK
          path: android/app/build/outputs/apk/debug/*.apk
