<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ઓફલાઇન ભારત સેટેલાઇટ મેપ</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        html, body, #map { height: 100%; width: 100%; margin: 0; padding: 0; }
        .leaflet-control-attribution { display: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-screen overflow-hidden select-none">

    <!-- Top Navigation Bar & Search -->
    <header class="bg-slate-900 border-b border-emerald-500/40 p-2.5 z-[1000] shadow-xl">
        <div class="flex items-center gap-2 mb-2">
            <div class="relative flex-1">
                <input type="text" id="searchInput" placeholder="રાજ્ય, જિલ્લો, તાલુકો કે ગામ શોધો..." 
                    class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-emerald-400">
                <button onclick="searchPlace()" class="absolute right-2 top-1.5 text-slate-400 hover:text-emerald-400">
                    <i class="fa-solid fa-magnifying-glass text-xs"></i>
                </button>
            </div>
            <button onclick="locateMe()" class="bg-blue-600 active:scale-95 text-white p-2 rounded-xl text-xs flex items-center justify-center w-8 h-8 shadow">
                <i class="fa-solid fa-location-crosshairs text-sm"></i>
            </button>
        </div>

        <div class="flex justify-between items-center text-[10px]">
            <span class="text-emerald-400 font-semibold" id="gps-status">📡 GPS: સ્ટેન્ડબાય</span>
            <button onclick="downloadCurrentBounds()" class="bg-emerald-600 active:scale-95 text-white font-bold px-3 py-1 rounded-lg flex items-center gap-1.5 shadow-md">
                <i class="fa-solid fa-cloud-arrow-down"></i> આ એરિયા ઓફલાઇન સેવ કરો
            </button>
        </div>
    </header>

    <!-- Satellite Map Engine -->
    <div id="map" class="flex-grow z-0"></div>

    <!-- Bottom Telemetry Monitor -->
    <footer class="bg-slate-900 border-t border-slate-800 p-2 z-[1000] text-[10px] flex justify-between items-center text-slate-300">
        <div>
            <span>સેવ થયેલી સેટેલાઇટ ટાઇલ્સ: </span>
            <span id="saved-count" class="font-bold text-amber-400">0</span>
        </div>
        <button onclick="clearStorage()" class="text-rose-400 hover:text-rose-300 active:scale-95">
            <i class="fa-solid fa-trash-can"></i> ડેટા સાફ કરો
        </button>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ૧. કાયમી ઓફલાઇન સ્ટોરેજ (IndexedDB)
        let db;
        const dbReq = indexedDB.open("BharatOfflineMapDB", 1);
        dbReq.onupgradeneeded = (e) => {
            db = e.target.result;
            db.createObjectStore("tiles", { keyPath: "key" });
        };
        dbReq.onsuccess = (e) => {
            db = e.target.result;
            updateTileCount();
        };

        // ૨. મેપ શરૂ કરવો (ડિફોલ્ટ ગુજરાત/ભારત વ્યૂ)
        const map = L.map('map', { zoomControl: false }).setView([21.5222, 70.4579], 12);
        const tileUrlTemplate = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';

        // કસ્ટમ લેયર: પહેલા ફોન સ્ટોરેજમાંથી ટાઇલ્સ લેશે, નહીંતર નેટ વાપરશે
        const OfflineTileLayer = L.TileLayer.extend({
            createTile: function(coords, done) {
                const tile = document.createElement('img');
                const tileKey = `${coords.z}/${coords.x}/${coords.y}`;

                if (db) {
                    const tx = db.transaction("tiles", "readonly");
                    const store = tx.objectStore("tiles");
                    const req = store.get(tileKey);
                    req.onsuccess = () => {
                        if (req.result) {
                            tile.src = req.result.dataUrl;
                            done(null, tile);
                        } else {
                            tile.crossOrigin = "Anonymous";
                            tile.src = L.Util.template(tileUrlTemplate, coords);
                            done(null, tile);
                        }
                    };
                    req.onerror = () => {
                        tile.src = L.Util.template(tileUrlTemplate, coords);
                        done(null, tile);
                    };
                } else {
                    tile.src = L.Util.template(tileUrlTemplate, coords);
                    done(null, tile);
                }
                return tile;
            }
        });

        const satelliteLayer = new OfflineTileLayer(tileUrlTemplate, { maxZoom: 18, minZoom: 4 }).addTo(map);

        // ૩. ગામ/તાલુકો/જિલ્લો ઓનલાઇન શોધવો
        async function searchPlace() {
            const query = document.getElementById('searchInput').value.trim();
            if(!query) return;
            document.getElementById('gps-status').innerText = "શોધાઈ રહ્યું છે...";
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ", India")}`);
                const data = await res.json();
                if(data && data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lon = parseFloat(data[0].lon);
                    map.setView([lat, lon], 14);
                    document.getElementById('gps-status').innerText = `સ્થળ મળ્યું: ${data[0].display_name.split(',')[0]}`;
                } else {
                    alert("સ્થળ મળ્યું નહીં! સાચું નામ લખી ફરી પ્રયત્ન કરો.");
                    document.getElementById('gps-status').innerText = "GPS: સ્ટેન્ડબાય";
                }
            } catch(e) {
                alert("શોધવામાં ભૂલ આવી, નેટ ચાલુ રાખો.");
            }
        }

        // ૪. GPS નેવિગેશન (ઓફલાઇન પણ ચાલશે)
        let myMarker = null;
        function locateMe() {
            document.getElementById('gps-status').innerText = "🛰️ લોકેશન ટ્રેક થાય છે...";
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    document.getElementById('gps-status').innerText = `🛰️ લાઇવ GPS (±${Math.round(pos.coords.accuracy)}m)`;
                    if(myMarker) {
                        myMarker.setLatLng([lat, lng]);
                    } else {
                        myMarker = L.circleMarker([lat, lng], { radius: 8, fillColor: '#2563eb', color: '#fff', weight: 2, fillOpacity: 1 }).addTo(map);
                    }
                    map.setView([lat, lng], 15);
                },
                (err) => {
                    alert("GPS સિગ્નલ મળતું નથી. લોકેશન પરમિશન ઓન કરો.");
                    document.getElementById('gps-status').innerText = "GPS એરર!";
                },
                { enableHighAccuracy: true, timeout: 15000 }
            );
        }

        // ૫. સેટેલાઇટ ટાઇલ્સ ઓફલાઇન ડાઉનલોડ કરવી
        async function downloadCurrentBounds() {
            const bounds = map.getBounds();
            const zoom = map.getZoom();

            if (zoom < 12) {
                alert("મહેરબાની કરીને થોડું વધારે ઝૂમ કરો જેથી ડાઉનલોડ ઝડપથી થાય અને મેમરી ભરાઈ ન જાય.");
                return;
            }

            const ok = confirm(`વર્તમાન વિસ્તારની લેવલ ${zoom} થી ${Math.min(zoom+2, 17)} સુધીની સેટેલાઇટ ઇમેજ ઓફલાઇન સેવ કરવી છે?`);
            if(!ok) return;

            document.getElementById('gps-status').innerText = "ડાઉનલોડ ચાલુ છે... કૃપા કરી રાહ જુઓ.";

            for (let z = zoom; z <= Math.min(zoom + 2, 17); z++) {
                const nw = map.project(bounds.getNorthWest(), z).divideBy(256).floor();
                const se = map.project(bounds.getSouthEast(), z).divideBy(256).floor();

                for (let x = nw.x; x <= se.x; x++) {
                    for (let y = nw.y; y <= se.y; y++) {
                        const url = L.Util.template(tileUrlTemplate, { x: x, y: y, z: z });
                        const key = `${z}/${x}/${y}`;
                        try {
                            const res = await fetch(url);
                            const blob = await res.blob();
                            const reader = new FileReader();
                            reader.onloadend = () => {
                                const tx = db.transaction("tiles", "readwrite");
                                tx.objectStore("tiles").put({ key: key, dataUrl: reader.result });
                            };
                            reader.readAsDataURL(blob);
                        } catch(e) {}
                    }
                }
            }
            setTimeout(() => {
                alert("આ વિસ્તાર સંપૂર્ણ ઓફલાઇન સેવ થઈ ગયો! હવે ઇન્ટરનેટ બંધ કરીને પણ નેવિગેટ કરી શકાશે.");
                updateTileCount();
                document.getElementById('gps-status').innerText = "ઓફલાઇન તૈયાર ✅";
            }, 3000);
        }

        function updateTileCount() {
            if(!db) return;
            const tx = db.transaction("tiles", "readonly");
            const req = tx.objectStore("tiles").count();
            req.onsuccess = () => {
                document.getElementById('saved-count').innerText = req.result;
            };
        }

        function clearStorage() {
            if(confirm("તમામ ઓફલાઇન મેપ્સ ડિલીટ કરવા છે?")) {
                const tx = db.transaction("tiles", "readwrite");
                tx.objectStore("tiles").clear();
                tx.oncomplete = () => {
                    updateTileCount();
                    alert("તમામ મેપ્સ સાફ થઈ ગયા.");
                };
            }
        }
    </script>
</body>
</html>
